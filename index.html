.selHead{z-index:1;position:relative;flex:none;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px 0}
.selBack{background:#ffffffed;border:2px solid #f6c9d9;border-radius:16px;padding:9px 12px;color:#8c5468;font-size:13px;font-weight:900;box-shadow:0 4px 0 #efb7cc50}
.selMode{color:#9d566a;border:2px solid #ffe8ce;background:#fff9eced;border-radius:99px;font-size:12px;font-weight:900;padding:8px 12px}
.selTitle{z-index:1;flex:none;text-align:center;padding:6px 0 5px;color:#9f496b;font-size:clamp(21px,6.3vw,28px);font-weight:1000;text-shadow:0 3px #fff,2px 0 #fff,-2px 0 #fff;letter-spacing:.025em}
.selTitleSmall{font-size:11px;font-weight:800;color:#9d6f76;text-align:center;margin-top:1px}
.selFeatured{z-index:1;flex:0 0 32%;min-height:130px;margin:4px 12px 8px;border:3px solid #fff;border-radius:24px;background:linear-gradient(135deg,#ffffffb0,#fff6ecbb);box-shadow:0 6px 0 #eab4c780,0 14px 30px #d69ca65c;display:flex;gap:6px;align-items:center;justify-content:center;padding:10px;position:relative;overflow:hidden;backdrop-filter:blur(2px)}
.selFeatured::before{content:"✦  ✧  ✦";position:absolute;top:7px;right:12px;color:#e9b24c;font-size:20px;letter-spacing:8px;opacity:.85}
.selFeaturedPic{height:100%;width:44%;min-width:0;display:grid;place-items:center;position:relative;align-self:stretch}
.selFeaturedPic img{max-height:100%;max-width:100%;height:100%;width:100%;object-fit:contain;filter:drop-shadow(0 5px 2px #aa82734a);animation:idle 2.7s ease-in-out infinite}
.selFeaturedInfo{min-width:0;flex:1;align-self:center;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.selFeaturedName{font-size:clamp(20px,5.5vw,25px);font-weight:1000;color:#bc5c78;text-shadow:0 2px #fff}
.selQuote{font-weight:800;font-size:clamp(11px,3.2vw,13px);line-height:1.65;background:#fffffff0;border:2px solid #f5dbdb;border-radius:16px;padding:8px 9px;color:#88656a;max-width:100%}
.selCheck{background:#f5a4ba;color:white;padding:5px 9px;font-size:11px;border-radius:99px;font-weight:900;box-shadow:0 3px 0 #dd7c9b}
.selCardArea{z-index:1;flex:1;min-height:0;padding:8px 12px;display:flex;flex-direction:column;gap:8px;border-top:3px solid #ffffffb0;background:linear-gradient(180deg,#fff2e9ee,#ffe6ebfa);border-radius:22px 22px 0 0}
.selChooseHeading{text-align:center;font-size:14px;font-weight:950;color:#ae5e70;flex:none}
.selGrid{min-height:0;flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px}
.selCard{min-width:0;min-height:0;border:2px solid #f5d6da;border-bottom-width:5px;border-radius:17px;background:linear-gradient(180deg,#fffefc,#ffedf1);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;padding:4px 2px;box-shadow:0 4px 11px #c6979f25;position:relative}
.selCard:nth-child(2){background:linear-gradient(#fff,#e6f3ff);border-color:#cbe1f1}
.selCard:nth-child(3){background:linear-gradient(#fff,#ffe7f0);border-color:#efc4d6}
.selCard:nth-child(4){background:linear-gradient(#fff,#fff0c7);border-color:#f3dba6}
.selCard:nth-child(5){background:linear-gradient(#fff,#f8e5d6);border-color:#e9d2be}
.selCard:nth-child(6){background:linear-gradient(#fff,#faeee3);border-color:#e6d4c2}
.selCard.chosen{border-color:#e97497;background:linear-gradient(#fffefd,#ffd6e3);box-shadow:0 0 0 2px white inset,0 3px 10px #e698ad79}
.selCard img{height:calc(100% - 29px);width:95%;object-fit:contain;filter:drop-shadow(0 3px 1px #c8a7a650)}
.selCard b{font-size:clamp(11px,3.1vw,14px);color:#87545d;white-space:nowrap}
.selCard .selectedBadge{position:absolute;right:2px;top:2px;border-radius:100%;background:#ed86a3;color:white;font-weight:900;font-size:12px;width:22px;height:22px;display:grid;place-items:center}
.selBottom{z-index:1;flex:none;padding:9px 12px max(12px,env(safe-area-inset-bottom));background:#ffe6eb;display:flex;gap:10px}
.selBottom button{border-radius:18px;min-height:51px;font-size:15px;font-weight:950}
.selBottom .selGo{flex:1;border:2px solid #ed819e;background:linear-gradient(180deg,#ffabc1,#f17e9f);color:white;box-shadow:0 5px 0 #d76f8d}
.selBottom .selCancel{padding:0 17px;border:2px solid #dfc4be;background:#fffefa;color:#95616a}
@media(max-height:730px){.selHead{padding-top:7px}.selTitle{padding:3px 0}.selFeatured{flex-basis:28%;min-height:108px;margin:4px 10px 6px;padding:6px}.selCardArea{padding:5px 10px;gap:4px}.selGrid{gap:5px}.selCard{border-radius:13px}.selQuote{padding:5px 7px}.selBottom{padding-top:6px;padding-bottom:9px}.selBottom button{min-height:44px}}

/* Ver.23: quiz screen art direction — preserves layout and game mechanics */
#app:has(.playHeader) {
  background:
    radial-gradient(circle at 10% 12%,rgba(255,238,163,.72) 0 5px,transparent 6px),
    radial-gradient(circle at 88% 20%,rgba(255,200,218,.7) 0 7px,transparent 8px),
    radial-gradient(circle at 18% 65%,rgba(180,226,172,.56) 0 4px,transparent 5px),
    linear-gradient(155deg,#e6f6ff 0%,#fffaf1 47%,#ffeaf0 100%);
}
#app:has(.playHeader) header {
  background:#ffffffdc;border:1px solid #f1d5dd;border-radius:16px;
  padding:7px 10px;box-shadow:0 5px 12px #d8b8be32;
}
#app:has(.playHeader) header strong {font-size:17px;color:#ad6174}
#app:has(.playHeader) section{gap:7px}
#app:has(.playHeader) .toprow .btn{
  background:#fff; border:2px solid #f1d5d9;border-radius:18px;
  box-shadow:0 3px 0 #efd4d9; color:#935b6b;
}
#app:has(.playHeader) .progress{height:12px;background:#fff;border:2px solid #edcdd8;border-radius:12px;margin:4px 0}
#app:has(.playHeader) .progress span{background:linear-gradient(90deg,#ffb466,#f18da7);border-radius:10px}
#app:has(.playHeader) .playHeader{
  display:grid;grid-template-columns:minmax(92px,34%) minmax(0,1fr);
  align-items:center;gap:10px;min-height:132px
}
#app:has(.playHeader) .playHeader .characterBox{
  width:100%;height:132px;min-width:0;max-width:none;overflow:hidden;
  border:3px solid #fff;outline:2px solid #f3ccd7;
  border-radius:24px;background:radial-gradient(ellipse at top,#fff9de,#fff1f7);
  box-shadow:0 5px 0 #f1d9df;
}
#app:has(.playHeader) .playHeader .characterBox img{
  height:114px;width:100%;max-height:114px;object-fit:contain
}
#app:has(.playHeader) .playHeader .characterBox .says{
  display:none!important;
}
#app:has(.playHeader) .playHeader>.panel{

{pages:['ある日、もちまるは 森の 入り口で 小さな かぎを 見つけました。','近くに 青い はこが ありました。もちまるが かぎを さすと、はこが 開きました。','はこの 中には 手紙が ありました。「かぎを ひろってくれて ありがとう」と 書いてありました。'],q:'もちまるは、どこで かぎを 見つけましたか？',a:'森の 入り口',o:['森の 入り口','川の そば','学校の 庭','家の 中'],exp:'さいしょの ページを よみかえしてみよう。'},
{pages:['雨の日、ももふわは かさを 持って 学校から 帰っていました。','とちゅうで、かさを 持っていない 友だちに 会いました。ももふわは「いっしょに 入ろう」と 言いました。','二人は 一つの かさに 入って、ゆっくり 歩きました。友だちは にっこり しました。'],q:'友だちは、どうして にっこり したのでしょう？',a:'かさに 入れて もらったから',o:['かさに 入れて もらったから','雨が やんだから','新しい かさを 買ったから','先に 帰れたから'],exp:'ももふわが 友だちに してあげたことを おもいだそう。'},

 q=[`${a} × ${b} は いくつ？`,`1ふくろに ${a}こ。${b}ふくろで なんこ？`,`1人に ${a}まいずつ ${b}人に くばると？`,`1さら ${a}こずつ ${b}さらで？`,`1はこに ${a}本ずつ ${b}はこで？`][style];unit=['','こ','まい','こ','本'][style];exp=`${a}×${b}＝${v}${unit}。`;
}else{
 a=n(2,8)*10;b=n(1,10)*5;
 if(style%2===0){v=a+b;q=`${a}cm と ${b}cm を あわせると？`;exp=`${a}＋${b}＝${v}cm。`}
 else{v=a+b;q=`赤い ひもが ${a}cm、青い ひもが ${b}cm。\nぜんぶで なんcm？`;exp=`${a}＋${b}＝${v}cm。`}
 unit='cm'
}
return {q,a:`${v}${unit}`,o:options(`${v}${unit}`,[`${v+10}${unit}`,`${Math.max(0,v-10)}${unit}`,`${v+1}${unit}`],r),exp,subject:'算数'};
}
function languageQ(i,r,used,avoid=new Set()){
 if(i>=8){let candidates=STORY_BANK.map((x,k)=>({...x,_id:k})).filter(x=>!used.includes(x._id)&&!avoid.has(x.q));if(!candidates.length)candidates=STORY_BANK.map((x,k)=>({...x,_id:k})).filter(x=>!used.includes(x._id));let pick=candidates[Math.floor(r()*candidates.length)]||STORY_BANK[0];used.push(pick._id);return {...pick,subject:'国語',story:true,o:shuffle(pick.o,r)}}
 if(i===3||i===7){let pick=chooseDistinct(WORD_BANK,r,avoid);return {...pick,subject:'国語',o:shuffle(pick.o,r)}}
 return newKanjiQ(r,avoid);
}
// 前日初回不正解の単元だけを翌日に引き継ぐ。画面のレイアウトは変更しない。
const PREV_KEY='mofu_yesterday_mistakes_v1';
function yesterdayDate(){let d=new Date();d.setDate(d.getDate()-1);return [d.getFullYear(),('0'+(d.getMonth()+1)).slice(-2),('0'+d.getDate()).slice(-2)].join('-')}
function topicOf(q,n){if(q.story)return 'reading';if(q.hard)return 'multi';if(q.subject==='算数')return ['addition','subtraction','multiplication','length'][n%4];return q.q.includes('よみかた')?'kanji':'sentence'}
function reviewRecords(from){if(!from||!Array.isArray(from.questions)||!from.attempts)return [];
return from.questions.flatMap((q,n)=>from.attempts[n]?.firstWrong?[{subject:q.subject,topic:topicOf(q,n),old:q.q,answer:q.a,storyPages:q.story?q.pages:null}]:[])}
function previousMistakes(old){let y=yesterdayDate();
if(old&&old.day===y)return reviewRecords(old);
try{let saved=JSON.parse(safeGet(PREV_KEY)||'null');return saved?.day===y&&Array.isArray(saved.items)?saved.items:[]}catch(e){return []}}
function sameQuestion(a,b){return a.q===b.old || (a.q===b.old&&a.a===b.answer)}
function distinctMath(topic,i,r,prev){
let candidate,tries=0;
do { candidate=mathQ(i,r);tries++ }while(tries<15&&sameQuestion(candidate,prev));
return candidate
}
function distinctLanguage(topic,i,r,prev,used){
let candidate,tries=0;
do { candidate=languageQ(i,r,used);tries++ }while(tries<35&&candidate.q===prev.old);
if(candidate.q===prev.old){
if(topic==='sentence'){let alternative=WORDS.find(w=>w.q!==prev.old);candidate={...alternative,subject:'国語',o:shuffle(alternative.o,r)}}
else {let alternative=KANJI.find(k=>!prev.old.includes('「'+k[0]+'」'));candidate={q:`「${alternative[0]}」の よみかたは？`,a:alternative[1],o:shuffle(alternative.slice(1),r),exp:`「${alternative[0]}」は「${alternative[1]}」と よむよ。`,subject:'国語'}}
}
return candidate
}
function makeSet(previous=[]){let r=rng(seedFrom(today()));let used=[];let avoid=new Set(getRecent().flatMap(x=>x.items||[]));
let m=Array.from({length:10},(_,i)=>{let q;for(let n=0;n<32;n++){q=mathQ(i,r);if(!avoid.has(q.q))break}avoid.add(q.q);return q}),j=Array.from({length:10},(_,i)=>{let q=languageQ(i,r,used,avoid);avoid.add(q.q);return q});
// 算数の基礎は最大3問を復習に。9・10は応用問題専用のまま。
let basic=previous.filter(x=>x.subject==='算数'&&x.topic!=='multi');
let basicSlots=[0,1,2,3,4,5,6,7],assigned=new Set();
for(let x of basic.slice(0,3)){
let ix=basicSlots.find(i=>['addition','subtraction','multiplication','length'][i%4]===x.topic&&!assigned.has(i));
if(ix===undefined)continue;
let q=distinctMath(x.topic,ix,r,x);q.review=true;q.reviewTopic=x.topic;m[ix]=q;assigned.add(ix);
}
let hard=previous.filter(x=>x.subject==='算数'&&x.topic==='multi');
for(let z=0;z<Math.min(2,hard.length);z++){
let ix=8+z;let q=distinctMath('multi',ix,r,hard[z]);q.review=true;q.reviewTopic='multi';m[ix]=q;
}
// 国語は8問の通常枠の中で最大3問、長文は長文枠の中で復習。
let normal=previous.filter(x=>x.subject==='国語'&&x.topic!=='reading');
let taken=new Set();
for(let x of normal.slice(0,3)){
let candidates=x.topic==='sentence'?[3,7]:[0,1,2,4,5,6];
let ix=candidates.find(i=>!taken.has(i));if(ix===undefined)continue;
let q=distinctLanguage(x.topic,ix,r,x,used);q.review=true;q.reviewTopic=x.topic;j[ix]=q;taken.add(ix)
}
let reading=previous.filter(x=>x.subject==='国語'&&x.topic==='reading');
for(let z=0;z<Math.min(2,reading.length);z++){
let ix=8+z,old=reading[z];let available=STORY_BANK.filter(s=>s.q!==old.old);
let story=available[Math.floor(r()*available.length)] || STORIES[0];
j[ix]={...story,subject:'国語',story:true,o:shuffle(story.o,r),review:true,reviewTopic:'reading'};
}
return [...m,...j]
}

const previous=previousMistakes(old);

data={day:today(),questions:makeSet(previous),attempts:{},complete:false,starCount:0};save();setRecent(data.day,data.questions);}

const ADV_RUN_KEY='mofu_adventure_run_questions_v30';
let advRunQuestions={};try{advRunQuestions=JSON.parse(safeGet(ADV_RUN_KEY)||'{}')||{}}catch(e){}
let advReplayQuestions=null;
function pickAdventureQuestions(stage){
 const pool=makeAdventurePool(stage,Math.random),chosen=[],seen=new Set();
 for(const q of pool){
  const family=stage===5 && /(へんは|ちょう点|へんを|へんが|角形の)/.test(q.q)?'shape-count':q.q.replace(/[0-9０-９]+/g,'#').replace(/三角形|四角形|五角形|六角形/g,'図形');
  if(seen.has(family))continue;
  chosen.push(q);seen.add(family);if(chosen.length===5)break;
 }
 if(chosen.length<5){for(const q of pool){if(chosen.includes(q))continue;chosen.push(q);if(chosen.length===5)break}}
 return chosen;
}
function adventureQuestionAt(stage,index){
 if(advReplay&&advReplayQuestions?.stage===stage)return advReplayQuestions.questions[index];
 if(!advRunQuestions[stage]){advRunQuestions[stage]=pickAdventureQuestions(stage);safeSet(ADV_RUN_KEY,JSON.stringify(advRunQuestions))}
 return advRunQuestions[stage][index]||ADV_WORLDS[stage].questions[index];
}
function makeAdventurePool(stage,r){
 let pool=[];
 const num=(a,b)=>a+Math.floor(r()*(b-a+1));
 if(stage===0||stage===2||stage===4){
  for(let k=0;k<75;k++){
   let a=num(2,9),b=num(2,9),v,unit='',q,hint;
   if(stage===0){let t=k%3;if(t===0){a=num(12,85);b=num(11,55);v=a+b;q=`森で 木の えだを ${a}本と ${b}本 あつめたよ。\nぜんぶで なん本？`;unit='本';hint=`${a}＋${b} を かんがえよう。`}
   if(t===1){a=num(50,98);b=num(15,a-1);v=a-b;q=`森に どんぐりが ${a}こ。${b}こ くばると のこりは？`;unit='こ';hint=`${a}−${b} を かんがえよう。`}
   if(t===2){v=a*b;q=`木を ${a}本ずつ ${b}か所に うえたよ。\nぜんぶで なん本？`;unit='本';hint=`${a}×${b} を かんがえよう。`}}
   if(stage===2){v=a*b;q=['とけいとうの 歯車が '+a+'こずつ '+b+'はこ。ぜんぶで？','かべの 星が '+a+'こずつ '+b+'列。ぜんぶで？','かざりが '+a+'こずつ '+b+'ふくろ。ぜんぶで？'][k%3];unit='こ';hint=`${a}×${b} を かんがえよう。`}
   if(stage===4){a=num(15,75);b=num(10,85);v=a+b;q=['橋の 板が '+a+'cmと '+b+'cm。あわせて？','川べに ひもが '+a+'cmと '+b+'cm。ぜんぶで？','テープが '+a+'cmと '+b+'cm。あわせて？'][k%3];unit='cm';hint=`${a}＋${b} を かんがえよう。`}
   pool.push({q,a:`${v}${unit}`,o:options(`${v}${unit}`,[`${v+10}${unit}`,`${Math.max(1,v-5)}${unit}`,`${v+2}${unit}`],r),hint});
  }
 }else if(stage===1){
  for(let [term,a] of READING_UNIQUE){let wrong=shuffle([...new Set(READING_UNIQUE.map(z=>z[1]).filter(z=>z!==a))],r).slice(0,3);pool.push({q:`図書館の 本に ある「${term}」の よみは？`,a,o:shuffle([a,...wrong],r),hint:`「${term}」は「${a}」だよ。`})}
 }else if(stage===3||stage===6){
  for(let x of WORD_BANK){pool.push({q:x.q,a:x.a,o:shuffle(x.o,r),hint:x.exp})}
  
 }else if(stage===5){
  const shapes=[['三角形','3','本','へん'],['四角形','4','本','へん'],['五角形','5','本','へん'],['六角形','6','本','へん'],['三角形','3','こ','ちょう点'],['四角形','4','こ','ちょう点'],['五角形','5','こ','ちょう点'],['六角形','6','こ','ちょう点']];
  for(let k=0;k<72;k++){let [shape,ans,unit,part]=shapes[k%shapes.length];let v=Number(ans);let style=Math.floor(k/shapes.length)%5;let q=[`${shape}の ${part}は いくつ？`,`石に ${shape}が かいてあるよ。${part}は なん${unit}？`,`かたちの カードは ${shape}。${part}を かぞえると？`,`${shape}の まわりを しらべよう。${part}は なん${unit}？`,`とびらの もようは ${shape}だよ。${part}は いくつ？`][style];pool.push({q,a:`${v}${unit}`,o:options(`${v}${unit}`,[`${v-1}${unit}`,`${v+1}${unit}`,`${v+2}${unit}`],r),hint:`${shape}の ${part}を かぞえてみよう。`})}
  pool.push(...ADV_WORLDS[5].questions);
 }
 return shuffle([...new Map(pool.map(x=>[x.q,x])).values()],r);
}

if(advReplay&&advReplay.stage===advStage){advReplay.step++;advAnswerLocked=false;advFeedback='';advCorrect=false;appState.screen=advReplay.step>=5?'advwin':([2,4].includes(advReplay.step)?'advstory':'adventure');if(appState.screen==='advstory')advEventStep=advReplay.step;render();return}
advState.completed[advStage]++;advState.stars++;saveAdventure();earnOnce('adventure-'+advStage+'-'+advState.completed[advStage],2);advAnswerLocked=false;advFeedback='';advCorrect=false;appState.screen=advState.completed[advStage]>=5?'advwin':([2,4].includes(advState.completed[advStage])?'advstory':'adventure');if(appState.screen==='advstory')advEventStep=advState.completed[advStage];render()}
function choose(id){appState.selected=id;safeSet('mofu_selected',id);render()}
function setSound(b){appState.sound=b;safeSet('mofu_sound',b?'on':'off')}
function go(s){advClearPreview=false;if(s==='home'){appState.pendingMode=null;advReplay=null}if(s==='adventure'){advReplay=null;advStage=advState.completed.findIndex(v=>v<5);if(advStage<0)advStage=6}appState.screen=s;appState.answered=false;appState.correct=false;appState.page=0;appState.reviewMode=false;if(s==='play'){appState.questionNo=firstUnfinished();if(appState.questionNo>=20){appState.screen='finish'}}render()}
function pageMove(delta){let n=appState.reviewMode?mistakes()[appState.reviewIndex]:appState.questionNo, x=data.questions[n];appState.page=Math.max(0,Math.min(x.pages.length,appState.page+delta));render()}
function talk(t){if(!appState.sound||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=1;speechSynthesis.speak(u)}catch(e){}}
function answer(i){if(appState.answered)return;let n=appState.reviewMode?mistakes()[appState.reviewIndex]:appState.questionNo,x=data.questions[n],ok=x.o[i]===x.a;appState.answered=true;appState.correct=ok;if(!appState.reviewMode){if(!data.attempts[n])data.attempts[n]={firstWrong:!ok,done:false};if(ok){data.attempts[n].done=true;data.starCount++;earnOnce('daily-'+data.day+'-'+n,1);}save()}render();$('#say').textContent=ok?'せいかい！':'おしい！';if(ok){let box=$('#movingCharacter');box.classList.remove(char().anim);void box.offsetWidth;box.classList.add(char().anim);talk('せいかい！')}else talk('おしい！ もういっかい！')}
function retry(){appState.answered=false;appState.correct=false;render()}
function next(){appState.answered=false;appState.correct=false;appState.page=0;if(appState.reviewMode){appState.reviewIndex++;if(appState.reviewIndex>=mistakes().length){appState.reviewMode=false;appState.screen='finish'}}else{appState.questionNo=firstUnfinished();if(appState.questionNo===20){data.complete=true;save();saveDailyHistory();earnOnce('daily-complete-'+data.day,5);appState.screen='finish'}}render()}
function startReview(){appState.screen='play';appState.reviewMode=true;appState.reviewIndex=0;appState.page=0;appState.answered=false;render()}

// ミニゲーム：デイリー・冒険とは独立した5問セット

{id:'kanji',name:'かんじパズル',icon:'📚',desc:'2年生の かん字を よもう！'},
{id:'kotoba',name:'ことばならべ',icon:'🧩',desc:'正しい 文を みつけよう！'}
];
const MINI_KANJI=[
['「海」の よみかたは？','うみ',['うみ','やま','かわ','そら']],
['「春」の よみかたは？','はる',['はる','なつ','あき','ふゆ']],
['「弟」の よみかたは？','おとうと',['おとうと','あに','あね','いもうと']],
['「朝」の よみかたは？','あさ',['あさ','ひる','よる','ゆう']],
['「星」の よみかたは？','ほし',['ほし','つき','そら','ひかり']],
['「公園」の よみかたは？','こうえん',['こうえん','がっこう','こうどう','こうばん']],
['「走る」の よみかたは？','はしる',['はしる','とまる','まわる','あるく']],
['「黄色」の よみかたは？','きいろ',['きいろ','あおいろ','くろいろ','しろいろ']],

const MINI_KOTOBA=[
['正しい 文を えらぼう！','わたしは 本を 読みます。',['わたしは 本を 読みます。','本は わたしを 読みます。','わたしは 本が 読みます。','読むは わたしを 本。']],
['「だれが」に あたるのは？\nねこが ねています。','ねこが',['ねこが','ねています','ねこが ねています','ねて']],

['「だれが」に あたるのは？\nおとうとが わらっています。','おとうとが',['おとうとが','わらっています','おとうと','わらい']]
];
let miniState={type:'kuku',items:[],index:0,score:0,locked:false,correct:false,answer:null};
function miniShuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function miniQuestions(type){
if(type==='kuku'){let pairs=[];for(let a=2;a<=9;a++)for(let b=2;b<=9;b++)pairs.push([a,b]);return miniShuffle(pairs).slice(0,5).map(([a,b])=>{let target=a*b;let opts=new Set([target]);for(let delta of [a,b,-a,-b,10,-10,2,-2]){if(opts.size>=4)break;let v=target+delta;if(v>0&&v<=81)opts.add(v);}let v=target+1;while(opts.size<4){if(v>0&&v<=81)opts.add(v);v++;}return {q:`${a} × ${b} = ？`,a:String(target),o:miniShuffle([...opts].map(String))}})}
let raw=type==='kanji'?READING_UNIQUE.map(([term,ans])=>({q:`「${term}」の よみかたは？`,a:ans})):WORD_BANK;
if(type==='kanji'){
 const pool=miniShuffle(raw).slice(0,5);return pool.map(x=>{let wrong=miniShuffle([...new Set(READING_UNIQUE.map(z=>z[1]).filter(a=>a!==x.a))]).slice(0,3);return {...x,o:miniShuffle([x.a,...wrong])}})
}
return miniShuffle(raw).slice(0,5).map(x=>({...x,o:miniShuffle(x.o)}));
}
function startMini(type){miniState={type,items:miniQuestions(type),index:0,score:0,locked:false,correct:false,answer:null};appState.screen='miniplay';render()}
function miniAnswer(i){if(miniState.locked)return;let q=miniState.items[miniState.index];miniState.locked=true;miniState.answer=q.o[i];miniState.correct=miniState.answer===q.a;if(miniState.correct)miniState.score++;render();let sp=$('#miniSpeech');if(sp)sp.textContent=miniState.correct?'せいかい！':'おしい！';if(miniState.correct){let el=$('#movingCharacter');el?.classList.add(char().anim);talk('せいかい！')}else talk('おしい！もういっかい！')}
function miniNext(){if(!miniState.locked)return;miniState.index++;miniState.locked=false;miniState.answer=null;if(miniState.index>=5){finishMiniRecord();appState.screen='minidone';}render()}
function renderMini(a){if(appState.screen==='mini'){a.innerHTML=header('ミニゲーム')+`<section><div class="toprow"><button class="btn" onclick="go('home')">← ホーム</button><span class="tag">なんどでも あそべるよ</span></div><div class="miniHero">${imgBox()}<div class="panel"><b>${char().name}と あそぼう！</b><span>すきな ゲームを えらんでね。</span></div></div><div class="miniList">${MINI_LIST.map(m=>`<button class="miniItem" onclick="startMini('${m.id}')"><span class="miniIcon">${m.icon}</span><span><b>${m.name}</b><small>${m.desc}</small></span></button>`).join('')}</div><p class="small" style="text-align:center">1ゲーム 5もん ／ デイリー・ぼうけんの きろくは かわらないよ</p></section>`;return}
let title=MINI_LIST.find(x=>x.id===miniState.type).name;
if(appState.screen==='minidone'){a.innerHTML=header('ミニゲーム')+`<section><div class="miniHero">${imgBox()}<div class="panel"><b>${title}</b><span>5もん クリア！</span></div></div><div class="panel miniDone"><div style="font-size:40px">🎉 ⭐ 🎉</div><h2>よく がんばったね！</h2><div style="font-size:22px;font-weight:900">${miniState.score} / 5 せいかい</div><p>${char().name}も おおよろこび！</p></div><button class="btn primary" onclick="startMini('${miniState.type}')">もういちど あそぶ</button><button class="btn" onclick="go('mini')">ほかの ゲームへ</button></section>`;return}
let q=miniState.items[miniState.index];a.innerHTML=header('ミニゲーム')+`<section><div class="toprow"><button class="btn" onclick="go('mini')">← ゲームを えらぶ</button><span class="tag">${miniState.index+1} / 5もん</span></div><div class="progress"><span style="width:${(miniState.index+1)*20}%"></span></div><div class="miniHero">${imgBox()}<div class="panel"><b>${title}</b><span id="miniSpeech">${char().name}が おうえんするよ！</span></div></div><div class="miniProblem">${q.q}</div><div class="miniChoices">${q.o.map((opt,i)=>`<button onclick="miniAnswer(${i})" ${miniState.locked?'disabled':''} class="${miniState.locked&&opt===q.a?'good':''}">${opt}</button>`).join('')}</div>${miniState.locked?`<div class="miniFeedback ${miniState.correct?'':'bad'}">${miniState.correct?'せいかい！ ⭐':'おしい！ こたえは「'+q.a+'」だよ'}</div><button class="btn primary" onclick="miniNext()">${miniState.index===4?'けっかを みる':'つぎの もんだいへ →'}</button>`:`<div class="miniFeedback">こたえを えらんでね</div>`}</section>`;
}
